name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  cpan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        run: perl .github/check-version.pl "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmodule-build-perl libapache-session-perl \
            libjson-perl libcrypt-urandom-perl libdbi-perl libdbd-sqlite3-perl \
            libcpan-uploader-perl

      - name: Build and test the distribution
        run: |
          perl Build.PL
          ./Build
          ./Build test
          ./Build distcheck
          ./Build dist
          test -f "Web-Session-${GITHUB_REF_NAME#v}.tar.gz"

      - name: Upload to CPAN
        if: github.repository == 'linagora/perl-Web-Session'
        env:
          PAUSE_USERNAME: ${{ secrets.PAUSE_USERNAME }}
          PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
        run: |
          if [ -z "$PAUSE_USERNAME" ] || [ -z "$PAUSE_PASSWORD" ]; then
            echo "::error::PAUSE_USERNAME and PAUSE_PASSWORD secrets are required"
            exit 1
          fi
          umask 077
          printf 'user %s\npassword %s\n' "$PAUSE_USERNAME" "$PAUSE_PASSWORD" > ~/.pause
          cpan-upload "Web-Session-${GITHUB_REF_NAME#v}.tar.gz"
